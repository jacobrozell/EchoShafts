name: EchoShafts
options:
  bundleIdPrefix: com.jacobrozell
  developmentTeam: "7JT2JB89AV"
  deploymentTarget:
    iOS: "17.0"
packages:
  EchoSim:
    path: ../EchoSim
settings:
  base:
    DEVELOPMENT_TEAM: 7JT2JB89AV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  EchoShafts:
    build:
      targets:
        EchoShafts: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  EchoShafts:
    type: application
    platform: iOS
    sources:
      - path: EchoShafts
        excludes:
          - Info.plist
          - EchoShafts.entitlements
    dependencies:
      - package: EchoSim
        product: EchoSim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.echoshafts
        INFOPLIST_FILE: EchoShafts/Info.plist
        CODE_SIGN_ENTITLEMENTS: EchoShafts/EchoShafts.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
